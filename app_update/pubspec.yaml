name: app_update
description: Shared Android in-app update client for Boqinai Flutter apps.
version: 0.11.0
publish_to: none

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.boqinai.app_update
        pluginClass: AppUpdatePlugin
