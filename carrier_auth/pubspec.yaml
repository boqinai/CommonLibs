name: carrier_auth
description: Standalone Aliyun carrier authorization for Flutter Android and iOS.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  # Reuse the pinned vendor binary once. No fusion API is invoked.
  fusion_auth:
    git:
      url: https://github.com/boqinai/CommonLibs.git
      ref: fusion_auth-v0.3.6
      path: fusion_auth

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.boqinai.carrierauth
        pluginClass: CarrierAuthPlugin
      ios:
        pluginClass: CarrierAuthPlugin
