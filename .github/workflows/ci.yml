name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [app_update, auth_client, fusion_auth, carrier_auth]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify fusion Flutter and CocoaPods version alignment
        run: python3 ../tool/check_fusion_versions.py
      - name: Verify fusion_auth Git LFS binaries and minimums
        if: matrix.package == 'fusion_auth'
        run: |
          set -eu
          aar="android/repo/com/alicom/fusion/fusionauth/1.2.16/fusionauth-1.2.16.aar"
          device="ios/Frameworks/AlicomFusionAuth.xcframework/ios-arm64/AlicomFusionAuth.framework/AlicomFusionAuth"
          sim="ios/Frameworks/AlicomFusionAuth.xcframework/ios-arm64_x86_64-simulator/AlicomFusionAuth.framework/AlicomFusionAuth"
          for f in "$aar" "$device" "$sim"; do
            if [ ! -s "$f" ]; then
              echo "missing SDK binary: $f" >&2
              exit 1
            fi
            if head -c 200 "$f" | grep -q "git-lfs.github.com"; then
              echo "Git LFS pointer was not checked out: $f" >&2
              exit 1
            fi
          done
          grep -q 'minSdk = 24' android/build.gradle.kts
          grep -q ":ios, '15.0'" ios/fusion_auth.podspec
          unzip -p "$aar" AndroidManifest.xml | grep -q 'android:versionName="1.2.8"'
      - name: Use checked-out SDK wrapper for carrier tests
        if: matrix.package == 'carrier_auth'
        run: |
          printf 'dependency_overrides:\n  fusion_auth:\n    path: ../fusion_auth\n' > pubspec_overrides.yaml
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_update/example
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --debug

  carrier-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: carrier_auth/example
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - if: runner.os == 'Linux'
        run: flutter build apk --debug
      - if: runner.os == 'macOS'
        run: flutter build ios --simulator --debug

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth_server
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: auth_server/go.mod
          cache-dependency-path: auth_server/go.sum
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: release_tool
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: astral-sh/ruff-action@v3
      - run: python -m unittest discover -v
      - run: python -m compileall -q .

  native-races:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Kotlin compiler
        run: |
          set -eu
          ver=2.0.21
          curl -fsSL -o /tmp/kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v${ver}/kotlin-compiler-${ver}.zip"
          unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Android download terminal-state race
        run: |
          set -eu
          kotlinc \
            app_update/android/src/main/kotlin/com/boqinai/app_update/DownloadTaskGate.kt \
            app_update/android/src/test/kotlin/com/boqinai/app_update/DownloadTaskGateTest.kt \
            -include-runtime -d /tmp/download-gate.jar
          java -jar /tmp/download-gate.jar
      - name: Android download commit rollback
        run: |
          set -eu
          kotlinc \
            app_update/android/src/main/kotlin/com/boqinai/app_update/DownloadTaskGate.kt \
            app_update/android/src/main/kotlin/com/boqinai/app_update/ApkInstallCommit.kt \
            app_update/android/src/test/kotlin/com/boqinai/app_update/ApkInstallCommitTest.kt \
            -include-runtime -d /tmp/apk-commit.jar
          java -jar /tmp/apk-commit.jar
      - name: Android fusion start_failed race
        run: |
          set -eu
          kotlinc \
            fusion_auth/android/src/main/kotlin/com/boqinai/fusionauth/FusionStartGate.kt \
            fusion_auth/android/src/test/kotlin/com/boqinai/fusionauth/FusionStartGateTest.kt \
            -include-runtime -d /tmp/fusion-gate.jar
          java -jar /tmp/fusion-gate.jar
      - name: Android fusion plugin start_failed
        run: |
          set -eu
          kotlinc \
            fusion_auth/android/src/main/kotlin/com/boqinai/fusionauth/FusionStartGate.kt \
            fusion_auth/android/src/main/kotlin/com/boqinai/fusionauth/FusionSceneController.kt \
            fusion_auth/android/src/test/kotlin/com/boqinai/fusionauth/FusionSceneControllerTest.kt \
            -include-runtime -d /tmp/fusion-scene.jar
          java -jar /tmp/fusion-scene.jar
      - name: Android fusion scene waits for token authentication
        run: |
          set -eu
          kotlinc \
            fusion_auth/android/src/main/kotlin/com/boqinai/fusionauth/FusionSceneStartGate.kt \
            fusion_auth/android/src/test/kotlin/com/boqinai/fusionauth/FusionSceneStartGateTest.kt \
            -include-runtime -d /tmp/fusion-authenticated-start.jar
          java -jar /tmp/fusion-authenticated-start.jar
      - name: Android fusion authentication deadline
        run: |
          set -eu
          kotlinc \
            fusion_auth/android/src/main/kotlin/com/boqinai/fusionauth/FusionAuthWatchdog.kt \
            fusion_auth/android/src/main/kotlin/com/boqinai/fusionauth/FusionStartGate.kt \
            fusion_auth/android/src/main/kotlin/com/boqinai/fusionauth/FusionSceneController.kt \
            fusion_auth/android/src/test/kotlin/com/boqinai/fusionauth/FusionAuthWatchdogTest.kt \
            -include-runtime -d /tmp/fusion-auth-deadline.jar
          java -jar /tmp/fusion-auth-deadline.jar
      - name: iOS fusion start_failed race
        run: |
          set -eu
          gcc -Wall -Werror -std=c11 -pthread \
            -I fusion_auth/ios/Classes \
            fusion_auth/ios/Classes/FusionStartGate.c \
            fusion_auth/ios/Tests/fusion_start_gate_test.c \
            -o /tmp/fusion_start_gate_test
          /tmp/fusion_start_gate_test
      - name: iOS fusion session generation
        run: |
          set -eu
          gcc -Wall -Werror -std=c11 -pthread \
            -I fusion_auth/ios/Classes \
            fusion_auth/ios/Classes/FusionStartGate.c \
            fusion_auth/ios/Classes/FusionSession.c \
            fusion_auth/ios/Tests/fusion_session_test.c \
            -o /tmp/fusion_session_test
          /tmp/fusion_session_test
