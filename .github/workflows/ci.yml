name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [app_update, auth_client]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_update/example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --debug

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: auth_server/go.mod
          cache-dependency-path: auth_server/go.sum
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: release_tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: astral-sh/ruff-action@v3
      - run: python -m unittest discover -v
      - run: python -m compileall -q .
